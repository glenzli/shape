[package]
name = "shape-desktop-bridge"
description = "Bounded CXX projection from Shape projects into the Qt desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
cxx.workspace = true
serde.workspace = true
serde_json.workspace = true
shape-core.workspace = true
shape-domain.workspace = true
shape-execution.workspace = true

[build-dependencies]
cxx-build = "=1.0.198"

[dev-dependencies]
image.workspace = true
uuid.workspace = true

# CXX generates the audited unsafe ABI shim in this crate. Product code still
# contains no handwritten unsafe blocks, and every other workspace crate keeps
# `unsafe_code = "forbid"`.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
