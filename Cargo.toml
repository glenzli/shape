[workspace]
members = [
    "apps/shape-cli",
    "crates/shape-core",
    "crates/shape-desktop-bridge",
    "crates/shape-domain",
    "crates/shape-execution",
    "crates/shape-store",
    "xtask",
]
default-members = [
    "apps/shape-cli",
    "crates/shape-core",
    "crates/shape-desktop-bridge",
    "crates/shape-domain",
    "crates/shape-execution",
    "crates/shape-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Shape contributors"]
license = "MIT"
publish = false

[workspace.dependencies]
blake3 = "1.8.5"
cxx = "=1.0.198"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
shape-core = { path = "crates/shape-core" }
shape-desktop-bridge = { path = "crates/shape-desktop-bridge" }
shape-domain = { path = "crates/shape-domain" }
shape-execution = { path = "crates/shape-execution" }
shape-store = { path = "crates/shape-store" }
thiserror = "2.0.18"
uuid = { version = "1.23.2", features = ["serde", "std", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev.package.shape-store]
opt-level = 3

[profile.test.package.shape-store]
opt-level = 3
