[workspace]
members = [
    "apps/shape-cli",
    "crates/shape-core",
    "crates/shape-desktop-bridge",
    "crates/shape-domain",
    "crates/shape-execution",
    "crates/shape-store",
    "xtask",
]
default-members = [
    "apps/shape-cli",
    "crates/shape-core",
    "crates/shape-desktop-bridge",
    "crates/shape-domain",
    "crates/shape-execution",
    "crates/shape-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Shape contributors"]
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.22.1"
blake3 = "1.8.5"
cxx = "=1.0.198"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
infer-runtime-client = { git = "https://github.com/glenzli/infer-runtime.git", rev = "679b121a0a338a66e99f920073620158d32d3e4e" }
reqwest = { version = "0.12.28", default-features = false }
rustix = { version = "1.1.4", features = ["fs", "process"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
shape-core = { path = "crates/shape-core" }
shape-desktop-bridge = { path = "crates/shape-desktop-bridge" }
shape-domain = { path = "crates/shape-domain" }
shape-execution = { path = "crates/shape-execution" }
shape-store = { path = "crates/shape-store" }
thiserror = "2.0.18"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.49.0", features = ["rt", "time"] }
uuid = { version = "1.23.2", features = ["serde", "std", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev.package.shape-store]
opt-level = 3

[profile.test.package.shape-store]
opt-level = 3
